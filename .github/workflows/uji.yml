# Deploy Worker dilakukan otomatis oleh Cloudflare Workers Builds (terhubung ke repo ini); workflow ini hanya menguji.
name: Uji

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Uji end-to-end (lokal)
        run: |
          cp .dev.vars.example .dev.vars
          ./scripts/reset-local.sh
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8787/api/me && break; sleep 1; done
          node test/e2e.mjs
