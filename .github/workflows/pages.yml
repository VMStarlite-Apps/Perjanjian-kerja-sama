name: Antarmuka di GitHub Pages

# Menyajikan antarmuka internal (public/) di GitHub Pages. Data, login, email, dan Drive tetap lewat API Worker.
on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  API_URL: https://starlite.hsans-din.workers.dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Susun situs
        run: |
          mkdir _site
          cp public/index.html public/pindah.js public/favicon.png _site/
          printf "window.STARLITE_API = '%s';\n" "$API_URL" > _site/config.js
          csp="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; frame-src 'self' blob:; connect-src 'self' $API_URL; object-src 'none'; base-uri 'self'"
          sed -i "s|<meta charset=\"utf-8\">|<meta charset=\"utf-8\">\n  <meta http-equiv=\"Content-Security-Policy\" content=\"$csp\">\n  <meta name=\"referrer\" content=\"same-origin\">|" _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
